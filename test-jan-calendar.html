<!DOCTYPE html>
<html>
<head><title>Test Jan Calendar</title></head>
<body>
<script>
// Simulate the calendar logic
const allEvents = [
  {id: 1419, event_date: "2026-01-31", program: "Seminar on folk music", venue: "TET"},
  {id: 1420, event_date: "2026-01-31", program: "Billy Kilson Live", venue: "TT"}
];

// January 2026
const year = 2026;
const month = 0; // January = 0
const daysInMonth = new Date(year, month + 1, 0).getDate();

const startDate = new Date(year, month, 1).toISOString().split('T')[0];
const endDate = new Date(year, month, daysInMonth).toISOString().split('T')[0];

console.log('January 2026 date range:', startDate, 'to', endDate);
console.log('Days in month:', daysInMonth);

// Filter events
const monthEvents = allEvents.filter(event => {
  const eventDate = event.event_date.toString();
  const result = eventDate >= startDate && eventDate <= endDate;
  console.log('Event:', event.event_date, 'in range?', result);
  return result;
});

console.log('Filtered events:', monthEvents.length);

// Group by date
const eventsByDate = {};
monthEvents.forEach(event => {
  const date = event.event_date;
  if (!eventsByDate[date]) eventsByDate[date] = [];
  eventsByDate[date].push(event);
});

console.log('Events by date:', eventsByDate);

// Check day 31
const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-31`;
console.log('Day 31 dateStr:', dateStr);
console.log('Has events on 31:', eventsByDate[dateStr] ? eventsByDate[dateStr].length : 0);
</script>
</body>
</html>
